<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YES 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* 🌻 SUNFLOWER SHOWER */
#sunflower-shower {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.sunflower {
    position: absolute;
    top: -50px;
    left: var(--left);
    width: var(--size);
    height: var(--size);
    object-fit: contain;
    opacity: var(--opacity);
    animation: sunflowerFall var(--duration) linear var(--delay) infinite;
}

@keyframes sunflowerFall {
    0% {
        transform: translate3d(0, -60px, 0) rotate(0deg);
    }

    50% {
        transform: translate3d(var(--drift), 50vh, 0) rotate(180deg);
    }

    100% {
        transform: translate3d(0, 110vh, 0) rotate(360deg);
    }
}

@media (prefers-reduced-motion: reduce) {
    .sunflower {
        animation: none;
    }
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe6f0, #fff7fb);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.card {
  background: #fff;
  border-radius: 30px;
  padding: 36px 28px;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(255, 182, 193, 0.35);
  position: relative;
z-index: 2;
}

.character {
  margin-bottom: 16px;
}

.character img {
  width: 120px;
}

h1 {
  font-size: 26px;
  color: #e16b9c;
  margin-bottom: 12px;
}

p {
  font-size: 15px;
  color: #7a5a64;
  line-height: 1.6;
}

.btn {
  margin-top: 20px;
  padding: 12px 28px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #ff9ecb, #ffb6c1);
  color: white;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 182, 193, 0.45);
}
</style>
</head>

<body>
<div id="sunflower-shower" aria-hidden="true"></div>
<audio id="bg-music" src="love-song.mp3" loop></audio>
  <div class="card">
  <div class="character">
    <!-- replace image later -->
    <img src="images/happy.png" alt="Happy">
  </div>

  <h1>You said YES awwww💗</h1>
  <p>
    uhuuuuuuuuhehe And just like that…
    In my heart there is only you🤍
    Im so happiee for your birth
    Thank you so much for being born
    and choosing meee.
  </p>

<button class="btn" onclick="goToHold()">
  Hold my hand forever🤍
</button>
</div>
<script>
const shower = document.getElementById("sunflower-shower");

for (let i = 0; i < 30; i++) {
    const flower = document.createElement("img");

    flower.src = "sunflower.png";
    flower.className = "sunflower";

    flower.style.setProperty(
        "--left",
        Math.random() * 100 + "vw"
    );

    flower.style.setProperty(
        "--size",
        12 + Math.random() * 14 + "px"
    );

    flower.style.setProperty(
        "--duration",
        7 + Math.random() * 6 + "s"
    );

    flower.style.setProperty(
        "--delay",
        -Math.random() * 12 + "s"
    );

    flower.style.setProperty(
        "--drift",
        -60 + Math.random() * 120 + "px"
    );

    flower.style.setProperty(
        "--opacity",
        0.55 + Math.random() * 0.4
    );

    shower.appendChild(flower);
}
</script>
  <script>
const music = document.getElementById("bg-music");

music.volume = 0.12;

const savedTime = sessionStorage.getItem("musicTime");

if (savedTime !== null) {
  music.currentTime = parseFloat(savedTime);
}

music.play().catch(() => {
  document.addEventListener("click", () => {
    music.play();
  }, { once: true });
});
    function goToHold() {
  const bgMusic = document.getElementById("bg-music");
  if (bgMusic) {
    bgMusic.pause();
    bgMusic.currentTime = 0;
    bgMusic.removeAttribute('src'); // Completely unloads the audio stream
    bgMusic.load();
  }
  sessionStorage.removeItem("musicTime");

  // Tiny delay to give the phone audio engine time to cut off
  setTimeout(() => {
    window.location.href = "hold.html";
  }, 100);
    }
    
  </script>
</body>
</html>
