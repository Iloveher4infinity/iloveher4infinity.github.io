<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flowers For My Priye Phool 🌷✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #ffd7eb 0%, #fff0f7 45%, #e8f5e9 100%);
      font-family: 'Quicksand', sans-serif;
      color: #6a0f70;
      text-align: center;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    /* Top Bar */
    .top-bar {
      max-width: 500px;
      margin: 12px auto 6px auto;
      text-align: left;
      padding: 0 14px;
      position: relative;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: #df4d88;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(255, 120, 160, 0.25);
      transition: transform 0.2s ease;
    }

    .back-btn:active {
      transform: scale(0.92);
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #c2185b;
      box-shadow: 0 3px 10px rgba(255, 100, 160, 0.2);
    }

    /* Headings */
    .header-box {
      position: relative;
      z-index: 25;
      pointer-events: none;
      padding: 0 12px;
      margin-bottom: 8px;
    }

    .title {
      font-size: clamp(20px, 5.4vw, 28px);
      font-weight: 800;
      color: #df4d88;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(255, 100, 160, 0.25);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13.5px;
      font-weight: 700;
      color: #882b5d;
      line-height: 1.4;
      max-width: 440px;
      margin: 0 auto;
    }

    .tap-hint {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 700;
      color: #e91e63;
      border: 1px dashed #ff80ab;
      animation: pulseHint 2s infinite ease-in-out;
    }

    @keyframes pulseHint {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Meadow Interactive Touch Zone */
    #gardenCanvas {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* Sprouted Flower Elements */
    .flower-sprout {
      position: absolute;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 12;
      animation: flowerBloom 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      filter: drop-shadow(0 8px 16px rgba(50, 20, 30, 0.25));
    }

    @keyframes flowerBloom {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(-15deg);
        opacity: 0;
      }
      70% {
        transform: translate(-50%, -50%) scale(1.15) rotate(6deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1) rotate(var(--rot));
        opacity: 1;
      }
    }

    /* Sparkle Particle on Tap */
    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      z-index: 18;
      animation: sparkleFade 0.7s ease-out forwards;
    }

    @keyframes sparkleFade {
      0% {
        transform: translate(-50%, -50%) scale(0.6);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3);
        opacity: 0;
      }
    }

    /* Floating Falling Petals (Petal Rain) */
    .petal-rain {
      position: fixed;
      top: -40px;
      pointer-events: none;
      z-index: 22;
      font-size: 22px;
      animation: petalFall linear forwards;
    }

    @keyframes petalFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 0.9;
      }
      100% {
        transform: translateY(115vh) rotate(360deg) translateX(50px);
        opacity: 0;
      }
    }

    /* Animated Fluttering Butterflies */
    .butterfly {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 24;
      transition: transform 0.1s linear;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    /* Bottom Control Bar */
    .control-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(255, 100, 160, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.9);
      max-width: 90vw;
    }

    .ctrl-btn {
      background: none;
      border: none;
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #9c27b0;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .ctrl-btn:active {
      transform: scale(0.9);
      background: rgba(255, 180, 210, 0.3);
    }
  </style>
</head>
<body>
<!-- Infinite Loop Audio Player -->
<audio id="page-music" src="flower-song.mp3" loop preload="auto"></audio>

<script>
  (function() {
    const audio = document.getElementById("page-music");
    if (audio) {
      audio.loop = true;
      audio.volume = 0.8;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          const startAudio = () => {
            audio.play();
            document.removeEventListener("touchstart", startAudio);
            document.removeEventListener("click", startAudio);
          };
          document.addEventListener("touchstart", startAudio, { once: true });
          document.addEventListener("click", startAudio, { once: true });
        });
      }
    }
  })();
</script>
  
  <!-- Top Navigation & Counter -->
  <div class="top-bar">
    <a href="hold.html?from=flower" class="back-btn">⬅ Back to Surprises 🌸</a>
    <div class="counter-badge" id="flowerCountBadge">🌷 0 Flowers</div>
  </div>

  <!-- Header Text -->
  <div class="header-box">
    <h1 class="title">Flowers for my priye phool🫀🌷</h1>
    <p class="subtitle">You Deserve alot of them you deserve whole field of flowersss cutuumuwah😝🌀</p>
    <div class="tap-hint">✨ Tap or glide anywhere to plant your favorites! ✨</div>
  </div>

  <!-- Meadow Interactive Field -->
  <div id="gardenCanvas"></div>

  <!-- Bottom Control Bar -->
  <div class="control-bar">
    <button class="ctrl-btn" onclick="triggerPetalRain()">🌧️ Petal Rain</button>
    <button class="ctrl-btn" onclick="summonButterflies()">🦋 Butterflies</button>
    <button class="ctrl-btn" onclick="clearMeadow()">🧹 Clear</button>
  </div>

  <script>
    // List of uploaded favorite flowers
    const flowerList = [
      "sunflower1.png",
      "rose1.png", "rose2.png", "rose3.png",
      "lily1.png", "lily2.png", "lily3.png",
      "tulip1.png", "tulip2.png"
    ];

    let plantedCount = 0;
    const canvas = document.getElementById("gardenCanvas");
    const countBadge = document.getElementById("flowerCountBadge");

    // Plant Flower at (x, y)
    function plantFlower(x, y) {
      // Don't spawn flowers directly over top bar or bottom buttons
      if (y < 120 || y > window.innerHeight - 80) return;

      const img = document.createElement("img");
      const randomFlower = flowerList[Math.floor(Math.random() * flowerList.length)];
      img.src = randomFlower;
      img.className = "flower-sprout";

      // Random gentle rotation & size variance
      const rot = (Math.random() * 40 - 20) + "deg";
      const size = Math.floor(Math.random() * 22) + 68; // 68px to 90px

      img.style.setProperty("--rot", rot);
      img.style.left = x + "px";
      img.style.top = y + "px";
      img.style.width = size + "px";
      img.style.height = "auto";

      document.body.appendChild(img);
      plantedCount++;
      countBadge.textContent = "🌷 " + plantedCount + " Flowers";

      // Sparkle burst around the plant
      spawnSparkles(x, y);
    }

    function spawnSparkles(x, y) {
      const sparkleIcons = ["✨", "💖", "🌸", "⭐"];
      for (let i = 0; i < 3; i++) {
        const sp = document.createElement("div");
        sp.className = "sparkle";
        sp.textContent = sparkleIcons[Math.floor(Math.random() * sparkleIcons.length)];
        sp.style.left = x + "px";
        sp.style.top = y + "px";

        const dx = (Math.random() * 60 - 30) + "px";
        const dy = (Math.random() * 60 - 40) + "px";
        sp.style.setProperty("--dx", dx);
        sp.style.setProperty("--dy", dy);

        document.body.appendChild(sp);
        setTimeout(() => sp.remove(), 700);
      }
    }

    // Touch & Click Listeners
    let isTouching = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener("click", (e) => {
      plantFlower(e.clientX, e.clientY);
    });

    canvas.addEventListener("touchstart", (e) => {
      isTouching = true;
      const t = e.touches[0];
      lastX = t.clientX;
      lastY = t.clientY;
      plantFlower(t.clientX, t.clientY);
    }, { passive: true });

    canvas.addEventListener("touchmove", (e) => {
      if (!isTouching) return;
      const t = e.touches[0];
      const dist = Math.hypot(t.clientX - lastX, t.clientY - lastY);
      // Spawn another if finger has moved at least 42px
      if (dist > 42) {
        lastX = t.clientX;
        lastY = t.clientY;
        plantFlower(t.clientX, t.clientY);
      }
    }, { passive: true });

    canvas.addEventListener("touchend", () => {
      isTouching = false;
    });

    // 🌧️ Petal Rain Feature
    function triggerPetalRain() {
      const petalIcons = ["🌸", "🌻", "🌷", "🌹", "✨", "🌺"];
      for (let i = 0; i < 35; i++) {
        setTimeout(() => {
          const p = document.createElement("div");
          p.className = "petal-rain";
          p.textContent = petalIcons[Math.floor(Math.random() * petalIcons.length)];
          p.style.left = Math.random() * 95 + "vw";
          p.style.fontSize = (Math.random() * 14 + 18) + "px";
          p.style.animationDuration = (Math.random() * 2.5 + 3.5) + "s";
          document.body.appendChild(p);

          setTimeout(() => p.remove(), 6000);
        }, i * 110);
      }
    }

    // 🦋 Fluttering Butterflies Feature
    function summonButterflies() {
      const bFlyIcons = ["🦋", "✨", "🦋"];
      for (let i = 0; i < 4; i++) {
        const bf = document.createElement("div");
        bf.className = "butterfly";
        bf.textContent = bFlyIcons[Math.floor(Math.random() * bFlyIcons.length)];

        let posX = Math.random() * (window.innerWidth - 60) + 30;
        let posY = Math.random() * (window.innerHeight - 200) + 100;
        bf.style.left = posX + "px";
        bf.style.top = posY + "px";

        document.body.appendChild(bf);

        // Gentle wandering animation
        let count = 0;
        const flightInterval = setInterval(() => {
          posX += (Math.random() * 80 - 40);
          posY += (Math.random() * 70 - 35);
          posX = Math.max(20, Math.min(window.innerWidth - 40, posX));
          posY = Math.max(120, Math.min(window.innerHeight - 100, posY));

          bf.style.transition = "transform 0.8s ease-in-out, left 0.8s ease-in-out, top 0.8s ease-in-out";
          bf.style.left = posX + "px";
          bf.style.top = posY + "px";
          bf.style.transform = `scale(${Math.random() * 0.3 + 0.9}) rotate(${Math.random() * 30 - 15}deg)`;

          count++;
          if (count > 12) {
            clearInterval(flightInterval);
            bf.remove();
          }
        }, 800);
      }
    }

    // 🧹 Clear Meadow
    function clearMeadow() {
      const flowers = document.querySelectorAll(".flower-sprout");
      flowers.forEach(f => {
        f.style.transition = "transform 0.4s ease, opacity 0.4s ease";
        f.style.transform = "scale(0) rotate(20deg)";
        f.style.opacity = "0";
        setTimeout(() => f.remove(), 400);
      });
      plantedCount = 0;
      countBadge.textContent = "🌷 0 Flowers";
    }
  </script>
</body>
  </html>
