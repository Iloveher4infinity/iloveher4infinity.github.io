<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A Little Birthday Surprise 🎂✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #ffe6ee, #fff4f8);
      overflow-x: hidden;
      text-align: center;
      color: #6a0f70;
      position: relative;
    }

    /* CAKE SCREEN */
    #cake-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      transition: opacity 0.8s ease;
    }

    .countdown {
      font-size: 90px;
      font-weight: 900;
      color: #ff3377;
      text-shadow: 0 6px 18px rgba(255, 60, 120, 0.35);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      transition: transform 0.25s ease;
    }

    .pop-anim {
      animation: numPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes numPop {
      0% { transform: scale(0.5); opacity: 0.4; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .blow-text {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 700;
      color: #d2799f;
    }

    .sub-text {
      margin-top: 6px;
      font-size: 14px;
      color: #b25b80;
      margin-bottom: 15px;
    }

    .cake {
      width: min(280px, 75vw);
      max-height: 330px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(255, 150, 180, 0.35));
      animation: cakeFloat 3s ease-in-out infinite;
    }

    @keyframes cakeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .blow-hint {
      margin-top: 15px;
      font-size: 13px;
      color: #b59aa3;
    }

    /* BIRTHDAY SCREEN */
    #birthday-screen {
      display: none;
      min-height: 100vh;
      padding: 35px 20px 50px 20px;
      animation: birthdayAppear 1s ease forwards;
    }

    @keyframes birthdayAppear {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .birthday-title {
      font-size: clamp(28px, 7vw, 35px);
      font-weight: 900;
      line-height: 1.05;
      color: #df729d;
      text-shadow: 0 5px 15px rgba(255, 150, 190, 0.35);
      margin-top: 10px;
    }

    .birthday-subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: #a77f8b;
    }

    /* STICKER BOARD */
    .gifts-title {
      margin-top: 25px;
      font-size: 21px;
      color: #d2799f;
      font-weight: 700;
    }

    .gifts-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #b59aa3;
    }

    .sticker-board {
      max-width: 380px;
      margin: 25px auto 40px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 20px;
      row-gap: 30px;
      padding: 10px;
    }

    .sticker {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .sticker:active {
      transform: scale(0.85) !important;
    }

    .sticker:nth-child(7) {
      grid-column: span 2;
      margin: 8px auto 0 auto;
    }

    .sticker-img {
      width: 105px;
      height: 105px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 14px rgba(220, 110, 150, 0.28));
      transition: transform 0.25s ease;
    }

    .sticker-name {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #9f4b7a;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      white-space: nowrap;
    }

    /* Rotations */
    .sticker-rot-1 { transform: rotate(7deg); }
    .sticker-rot-2 { transform: rotate(-3deg); }
    .sticker-rot-3 { transform: rotate(-4deg); }
    .sticker-rot-4 { transform: rotate(6deg); }
    .sticker-rot-5 { transform: rotate(4deg); }
    .sticker-rot-6 { transform: rotate(-5deg); }

    /* FLOATING HEARTS */
    .heart {
      position: fixed;
      bottom: -40px;
      pointer-events: none;
      user-select: none;
      animation: heartFlyUp linear forwards;
      z-index: 8000;
      display: inline-block;
    }

    @keyframes heartFlyUp {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; transform: translateY(-50px) scale(1) rotate(5deg); }
      90% { opacity: 0.85; }
      100% { transform: translateY(-115vh) scale(1.1) rotate(25deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio Player (Song 2) -->
<audio id="birthday-music" src="birthday-song.mp3" loop preload="auto"></audio>
  
  <!-- CAKE SCREEN -->
  <section id="cake-screen">
    <div class="countdown pop-anim" id="countdown">3</div>
    <div class="blow-text">Blow in...</div>
    <div class="sub-text">Make a little heartily birthday wish first cutu💗</div>
    <img src="Cake.png" class="cake" alt="Birthday Cake" />
    <div class="blow-hint">get readyyy my love...</div>
  </section>

  <!-- BIRTHDAY REVEAL SCREEN -->
  <section id="birthday-screen">
    <div class="birthday-title">
      HAPPIEST<br />BIRTHDAYYY 🎂
    </div>
    <div class="birthday-subtitle">
      May your everyday be as loveliest as your smiles 💗
    </div>

    <div class="gifts-title">
      A few little surprises for miss everything 🎀
    </div>
    <div class="gifts-subtitle">
      Tap one... lets see what is you getting yaayy ^^
    </div>

    <!-- STICKER BOARD (All 7 Surprises) -->
    <div class="sticker-board">
      <button class="sticker sticker-rot-1" onclick="openPage('blessing.html')">
        <img src="blessing.png" alt="You My Blessing" class="sticker-img" />
        <span class="sticker-name">You My Blessing 🧿</span>
      </button>

      <button class="sticker sticker-rot-2" onclick="openPage('letter.html')">
        <img src="letter.png" alt="Letter" class="sticker-img" />
        <span class="sticker-name">Letter 💌</span>
      </button>

      <button class="sticker sticker-rot-3" onclick="openPage('cake-page.html')">
        <img src="cake-sticker.png" alt="Cake" class="sticker-img" />
        <span class="sticker-name">Cake 🎂</span>
      </button>

      <button class="sticker sticker-rot-4" onclick="openPage('flower.html')">
        <img src="flower.png" alt="Flowers" class="sticker-img" />
        <span class="sticker-name">Flowers 🌷</span>
      </button>

      <button class="sticker sticker-rot-5" onclick="openPage('gift.html')">
        <img src="gift.png" alt="Gift" class="sticker-img" />
        <span class="sticker-name">Gift 🎁</span>
      </button>

      <button class="sticker sticker-rot-6" onclick="openPage('memory.html')">
        <img src="memory.png" alt="Memory" class="sticker-img" />
        <span class="sticker-name">Memory 🧸</span>
      </button>

      <!-- 7th Button: Grand Ending Page -->
      <button class="sticker sticker-rot-1" onclick="openPage('ending.html')">
        <img src="ending.png" alt="Ending" class="sticker-img" onerror="this.src='gift.png'" />
        <span class="sticker-name">Forever Maya 💍✨</span>
      </button>
    </div>
  </section>

  <script>
// 1. Audio Handler (Continuous Loop + Mobile Touch Unlock)
const birthdayMusic = document.getElementById("birthday-music");
if (birthdayMusic) {
  birthdayMusic.loop = true;
  birthdayMusic.volume = 0.75;
  const playPromise = birthdayMusic.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      const startBGM = () => {
        birthdayMusic.play();
        document.removeEventListener("touchstart", startBGM);
        document.removeEventListener("click", startBGM);
      };
      document.addEventListener("touchstart", startBGM, { once: true });
      document.addEventListener("click", startBGM, { once: true });
    });
  }
}

    // 2. Countdown Engine & Return Detection
    const countdownEl = document.getElementById("countdown");
    const cakeScreen = document.getElementById("cake-screen");
    const birthdayScreen = document.getElementById("birthday-screen");

    const urlParams = new URLSearchParams(window.location.search);
    const returningFromSurprise = urlParams.get("from");

    if (returningFromSurprise) {
      cakeScreen.style.display = "none";
      birthdayScreen.style.display = "block";
      birthdayScreen.style.opacity = "1";
      createHearts();
    } else {
      const numbers = ["3", "2", "1", "🎉"];
      let index = 0;

      const countdownTimer = setInterval(() => {
        index++;
        if (index < numbers.length) {
          countdownEl.classList.remove("pop-anim");
          void countdownEl.offsetWidth;
          countdownEl.textContent = numbers[index];
          countdownEl.classList.add("pop-anim");
        } else {
          clearInterval(countdownTimer);
          setTimeout(() => {
            cakeScreen.style.opacity = "0";
            setTimeout(() => {
              cakeScreen.style.display = "none";
              birthdayScreen.style.display = "block";
              birthdayScreen.style.opacity = "1";
              createHearts();
            }, 700);
          }, 650);
        }
      }, 1000);
    }

    // 3. Floating Hearts Animation
    function createHearts() {
      const heartIcons = ["💖", "💗", "🌸", "⭐", "💕", "🎀", "✨", "💓"];
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        const randomLeft = Math.floor(Math.random() * 89) + 5;
        heart.style.left = randomLeft + "vw";

        const randomDuration = (3.5 + Math.random() * 3).toFixed(1);
        heart.style.animationDuration = randomDuration + "s";
        heart.style.fontSize = (16 + Math.floor(Math.random() * 12)) + "px";

        document.body.appendChild(heart);
        setTimeout(() => {
          heart.remove();
        }, 6500);
      }, 350);
    }

    // 4. Navigation
    function openPage(pageUrl) {
      window.location.href = pageUrl;
    }
  </script>
</body>
  </html>
