<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>A Little Birthday Surprise 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(180deg, #ffe6ee, #fff4f8);
  overflow-x: hidden;
  text-align: center;
  color: #8a6f78;
}

/* ---------- MAIN SCREEN ---------- */

#cake-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
  transition: opacity 0.8s ease;
}

.cake {
  width: min(280px, 75vw);
  max-height: 330px;
  object-fit: contain;
  filter: drop-shadow(0 15px 25px rgba(255, 150, 190, 0.35));
  animation: cakeFloat 2.5s ease-in-out infinite;
}

@keyframes cakeFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-10px);
  }
}

.blow-text {
  margin-top: 15px;
  font-size: 24px;
  font-weight: 700;
  color: #d9799f;
}

.sub-text {
  margin-top: 7px;
  font-size: 14px;
  color: #b28c98;
}

.countdown {
  font-size: 90px;
  font-weight: 900;
  color: #ff3377;
  text-shadow: 0 6px 18px rgba(255, 60, 120, 0.35);
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease, opacity 0.2s ease;
  }

@keyframes numPop {
  0% { transform: scale(0.5); opacity: 0; }
  70% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
  

.blow-hint {
  margin-top: 5px;
  font-size: 13px;
  color: #b59aa3;
}

/* ---------- BIRTHDAY SCREEN ---------- */

#birthday-screen {
  display: none;
  min-height: 100vh;
  padding: 35px 20px;
  animation: birthdayAppear 1s ease forwards;
}

@keyframes birthdayAppear {
  from {
    opacity: 0;
    transform: scale(0.9);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.birthday-title {
  font-size: clamp(42px, 12vw, 85px);
  font-weight: 900;
  line-height: 0.95;
  color: #df729d;
  text-shadow:
    0 5px 15px rgba(255, 150, 190, 0.35);
  margin-top: 30px;
}

.birthday-subtitle {
  margin-top: 18px;
  font-size: 17px;
  color: #a77f8b;
}

/* ---------- STICKER BOARD ---------- */

.gifts-title {
  margin-top: 55px;
  font-size: 25px;
  color: #d9799f;
}

.gifts-subtitle {
  margin-top: 7px;
  font-size: 13px;
  color: #b59aa3;
}

.sticker-board {
  max-width: 650px;
  margin: 25px auto 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.sticker {
  border: none;
  background: rgba(255, 255, 255, 0.72);
  border-radius: 25px;
  padding: 22px 10px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255, 170, 200, 0.25);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.sticker:hover {
  transform: translateY(-7px) rotate(-2deg) scale(1.04);
  box-shadow: 0 15px 30px rgba(255, 150, 190, 0.35);
}

.sticker:active {
  transform: scale(0.95);
}

.sticker-img {
  width: 50px;
  height: 50px;
  object-fit: contain;
  display: block;
  margin: 0 auto 8px auto;
  filter: drop-shadow(0 4px 6px rgba(255, 120, 160, 0.25));
}
  

.sticker-name {
  font-size: 13px;
  font-weight: 700;
  color: #a96f83;
}

/* ---------- FLOATING HEARTS ---------- */

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 18px;
  pointer-events: none;
  animation: heartUp linear forwards;
  z-index: 0;
}

@keyframes heartUp {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }

  15% {
    opacity: 0.7;
  }

  to {
    transform: translateY(-110vh) rotate(25deg);
    opacity: 0;
  }
}

/* ---------- MOBILE ---------- */

@media (max-width: 500px) {

  .sticker-board {
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .sticker {
    padding: 18px 8px;
  }

  .sticker-icon {
    font-size: 40px;
  }

  .birthday-title {
    margin-top: 15px;
  }

}

</style>
</head>


<body>
<audio id="birthday-music" src="birthday-song.mp3" loop></audio>
<!-- ================= CAKE SCREEN ================= -->

<section id="cake-screen">

  <div class="countdown" id="countdown">
    3
  </div>

  <div class="blow-text">
    Blow in... 🕯️
  </div>

  <div class="sub-text">
    Make a little heartly birthday wishh cutu ji💗
  </div>

  <img src="Cake.png" class="cake" alt="Birthday cake">

  <div class="blow-hint">
    get readyyy my love...
  </div>
  

</section>


<!-- ================= BIRTHDAY SCREEN ================= -->

<section id="birthday-screen">

  <div class="birthday-title">
    HAPPIE<br>
    BIRTHDAYYY🎂
  </div>

  <div class="birthday-subtitle">
    May your everyday be as loveliest as your smilee💗✨
  </div>


  <div class="gifts-title">
    A few little surprises for miss everything🎀
  </div>

  <div class="gifts-subtitle">
    Tap one... lets see what is you getting yaayy 👀
  </div>


  <div class="sticker-board">

        <button class="sticker" onclick="openPage('blessing.html')">
          <img src="blessing.png" alt="You My Blessing" class="sticker-img">
          <span class="sticker-name">You My Blessing 🧿</span>
        </button>

        <button class="sticker" onclick="openPage('letter.html')">
          <img src="letter.png" alt="Letter" class="sticker-img">
          <span class="sticker-name">Letter 💌</span>
        </button>

        <button class="sticker" onclick="openPage('cake-page.html')">
          <img src="cake-sticker.png" alt="Cake" class="sticker-img">
          <span class="sticker-name">Cake 🎂</span>
        </button>

        <button class="sticker" onclick="openPage('flower.html')">
          <img src="flower.png" alt="Flowers" class="sticker-img">
          <span class="sticker-name">Flowers 🌷</span>
        </button>

        <button class="sticker" onclick="openPage('gift.html')">
          <img src="gift.png" alt="Gift" class="sticker-img">
          <span class="sticker-name">Gift 🎁</span>
        </button>

        <button class="sticker" onclick="openPage('memory.html')">
          <img src="memory.png" alt="Memory" class="sticker-img">
          <span class="sticker-name">Memory 🧸</span>
        </button>
    
  </div>

</section>


<script>

/* =========================================
   MUSIC
========================================= */
const birthdayMusic = document.getElementById("birthday-music");

if (birthdayMusic) {
  birthdayMusic.volume = 0.12;
  birthdayMusic.play().catch(() => {
    document.addEventListener("click", () => {
      birthdayMusic.play();
    }, { once: true });
  });
}
  
/* =========================================
   COUNTDOWN
========================================= */

const countdown = document.getElementById("countdown");

const cakeScreen = document.getElementById("cake-screen");

const birthdayScreen = document.getElementById("birthday-screen");

let numbers = ["3", "2", "1", "🎉"];
let index = 0;

countdown.textContent = numbers[0];

const countdownTimer = setInterval(() => {
  index++;
  
  if (index < numbers.length) {
    countdown.textContent = numbers[index];
  } else {
    clearInterval(countdownTimer);
    setTimeout(() => {
      cakeScreen.style.opacity = "0";
      setTimeout(() => {
        cakeScreen.style.display = "none";
        birthdayScreen.style.display = "block";
        createHearts();
      }, 800);
    }, 700);
  }
}, 1000);
  
/* =========================================
   FLOATING HEARTS
========================================= */

function createHearts() {

  setInterval(() => {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = ["💗", "💖", "💕", "💓", "🌸", "✨"];

    heart.textContent =
      hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
      Math.random() * 100 + "vw";

    heart.style.animationDuration =
      5 + Math.random() * 5 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 10000);

  }, 700);

}


/* =========================================
   STICKER BUTTONS
========================================= */

  function openPage(pageUrl) {
  window.location.href = pageUrl;
}

}

</script>

</body>
</html>
